[project]
name = "ci-failure-analyzer"
version = "0.1.0"
description = "Analyze pytest CI failures and report cause candidates with evidence"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "pydantic>=2.9",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
