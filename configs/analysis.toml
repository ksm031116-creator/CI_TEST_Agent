# Settings shared by every analysis method. Changing the model invalidates
# comparison with earlier results; see docs/analysis_methods.md.
model = "claude-opus-5-5"
# Reasoning effort sent with every call. The model's default, written out so runs are comparable.
effort = "medium"
# Upper bound on output per call, including the model's reasoning tokens.
max_output_tokens = 8000

[budget]
# Hard limit on total API spending for this project, in US dollars.
# Set by the project owner (100 on 2026-11-19, lowered to 85 on 2026-11-20).
# Enforced by analysis/budget.py.
total_limit_usd = 85

[pricing]
# Anthropic API list prices, US dollars per million tokens.
date = "2026-11-03"

[pricing.models.claude-opus-5-5]
input_per_mtok = 4.00
output_per_mtok = 20.00

[pricing.models.claude-sonnet-5-5]
input_per_mtok = 2.00
output_per_mtok = 10.00

[pricing.models.claude-haiku-5-5]
input_per_mtok = 0.10
output_per_mtok = 0.50
