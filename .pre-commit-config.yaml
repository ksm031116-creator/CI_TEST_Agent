# Setup: see git_management.md (secret scanning section)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      # Eval inputs must stay byte-identical to the collected originals.
      - id: end-of-file-fixer
        exclude: ^evals/cases/
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        exclude: ^evals/cases/
